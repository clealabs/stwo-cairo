[package]
name = "cairo-prove"
version = "0.1.0"
edition = "2024"

[patch.crates-io]
stwo_cairo_prover = { git = "https://github.com/clealabs/stwo-cairo", branch = "62c3c4a-fix-wasm" }

[dependencies]
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "62c3c4a", default-features = false}
stwo_cairo_prover = { git = "https://github.com/clealabs/stwo-cairo", branch = "62c3c4a-fix-wasm" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "62c3c4a" }
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "62c3c4a" }
cairo-lang-compiler = { git = "https://github.com/clealabs/cairo.git", branch = "fix-wasm" }
cairo-lang-executable = { git = "https://github.com/clealabs/cairo.git", branch = "fix-wasm" }
cairo-lang-runner = { git = "https://github.com/clealabs/cairo.git", branch = "fix-wasm" }
cairo-lang-casm = { git = "https://github.com/clealabs/cairo.git", branch = "fix-wasm" }
cairo-lang-utils = { git = "https://github.com/clealabs/cairo.git", branch = "fix-wasm" }
serde_json = "1.0.138"
cairo-vm = { git = "https://github.com/lambdaclass/cairo-vm", rev = "b1a91f929b5fa29a1a2e9e6990a68a1220c0c673", features = ["mod_builtin"], default-features = false}
clap = { version = "4.5.38", features = ["derive"] }
num-bigint = "0.4.6"
camino = "1.1.9"
log = "0.4.20"
env_logger = "0.11.3"
